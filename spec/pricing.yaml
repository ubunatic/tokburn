# Illustrative model-tier pricing for the tokburn demo.
# Prices are round example numbers, not any vendor's real price list.
cliff_tokens: 100000        # prompt size where the long-context surcharge starts
cliff_inclusive: true       # a prompt of exactly cliff_tokens is already surcharged
surcharge_multiplier: 2     # whole-prompt price factor at or above the cliff
game_round_tasks: 20
min_per_tier: 2
budget_all_m_factor: 1.02
break_penalty_redo_factor: 0.27
good_score: 80              # golden-route cost / actual cost * 100; perfect = 100
joker_start: 1
joker_combo_answers: 3
joker_fast_seconds: 3
joker_combo_reward: 1
tiers:
  - name: low
    usd_per_million: 0.25
    good_for: "formatting, grep triage, markdown cleanup"
  - name: mid
    usd_per_million: 1.50
    good_for: "feature implementation, test suites"
  - name: high
    usd_per_million: 6.00
    good_for: "architecture, hard bug triage, review gates"
